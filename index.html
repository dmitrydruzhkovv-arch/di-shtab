<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ШТАБ · Мостик</title>
<style>
  :root{
    --ink:#e9edfb; --muted:#9aa6c8; --faint:#66708f;
    --line:#222a44; --line2:#2c3557;
    --bg:#080b16; --bg2:#0b0f1e; --surface:#111731; --surface2:#0d1226;
    /* стримы — неон на тёмном (без жёлтого) */
    --s-core:#8ea2c9; --s-трафик:#21e6c1; --s-продукт:#8b7dff; --s-контент:#ff5b86; --s-личный:#7a84a6;
    --glow:#8b7dff;
    --ok:#3ddc97; --live:#4d8bff; --wait:#5a6485;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 80% -10%, #171f3e 0%, transparent 55%),
      radial-gradient(900px 600px at 0% 100%, #14183a 0%, transparent 50%),
      var(--bg);
    -webkit-font-smoothing:antialiased; line-height:1.4;
  }
  .num{font-variant-numeric:tabular-nums;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .wrap{max-width:1560px; margin:0 auto; padding:20px 22px 60px}

  /* Шапка */
  .topbar{display:flex; align-items:baseline; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:18px}
  .brand{font-size:22px; letter-spacing:.16em; color:var(--muted)}
  .brand b{color:var(--ink); letter-spacing:.12em;
    text-shadow:0 0 18px rgba(139,125,255,.55)}
  .topmeta{font-size:13px; color:var(--faint)}
  .topmeta b{color:var(--muted); font-weight:600}

  /* Карточки */
  .card{background:linear-gradient(180deg,var(--surface),var(--surface2));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:18px;
    box-shadow:0 20px 50px -30px rgba(0,0,0,.9)}
  .card h2{margin:0 0 14px; font-size:13px; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
  .hint{font-weight:400; text-transform:none; letter-spacing:0;
    color:var(--faint); font-size:12.5px; margin-left:8px}

  /* Мостик-рама: миссия + KPI */
  .hero{display:grid; grid-template-columns:minmax(240px,1fr) 2.5fr;
    gap:16px; margin-bottom:16px}
  @media(max-width:760px){.hero{grid-template-columns:1fr}}
  .mission{position:relative; overflow:hidden;
    background:linear-gradient(160deg,#161d3d,#0e1330);
    border:1px solid var(--line2); border-radius:var(--radius);
    padding:22px 24px; display:flex; flex-direction:column; justify-content:center}
  .mission::after{content:""; position:absolute; inset:0;
    background:radial-gradient(320px 160px at 80% 0%, rgba(139,125,255,.22), transparent 70%);
    pointer-events:none}
  .mission-label{font-size:12.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.08em; margin-bottom:8px}
  .mission-num{font-size:60px; font-weight:800; letter-spacing:-.02em; line-height:1}
  .mission-num .cur{color:var(--faint)}
  .mission-num .tgt{color:#b7adff; text-shadow:0 0 26px rgba(139,125,255,.7)}
  .mission-spark{display:flex; align-items:flex-end; gap:4px; height:26px; margin-top:14px}
  .mission-spark i{width:8px; background:linear-gradient(180deg,var(--s-продукт),#4b3fb0);
    border-radius:3px; opacity:.85; display:block}
  .mission-sub{font-size:12.5px; color:var(--faint); margin-top:12px}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:11px}
  .tile{background:var(--surface2); border:1px solid var(--line);
    border-radius:13px; padding:13px 15px; transition:border-color .2s, box-shadow .2s}
  .tile:hover{border-color:var(--line2); box-shadow:0 0 0 1px rgba(139,125,255,.15)}
  .tile .k{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px}
  .tile .v{font-size:29px; font-weight:800; letter-spacing:-.01em; margin-top:4px; color:var(--ink)}
  .tile .v .u{font-size:14px; font-weight:600; color:var(--faint); margin-left:3px}
  .tile .t{font-size:11px; color:var(--faint); margin-top:2px}
  .tile.ns{border-color:rgba(139,125,255,.4)}
  .tile.ns .v{color:#b7adff; text-shadow:0 0 20px rgba(139,125,255,.5)}
  .star{color:var(--s-контент)}
  .prices{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:13px;
    padding-top:13px; border-top:1px dashed var(--line2); font-size:13px; color:var(--muted)}
  .prices b{color:var(--ink); font-weight:700}

  /* Граф-мир (командная рубка) */
  .graph-card h2{display:flex; align-items:center; flex-wrap:wrap; gap:8px}
  .lensbar{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 4px}
  .lensbtn{font:inherit; font-size:12.5px; color:var(--muted);
    background:var(--surface2); border:1px solid var(--line);
    border-radius:9px; padding:5px 13px; cursor:pointer; transition:all .18s}
  .lensbtn:hover{border-color:var(--line2); color:var(--ink)}
  .lensbtn.on{color:#fff; border-color:transparent;
    background:linear-gradient(180deg,#6f63e0,#5344b8);
    box-shadow:0 6px 20px -8px rgba(139,125,255,.8)}
  .lensbtn .kb{font-size:10px; color:var(--faint); margin-left:6px}
  .lensbtn.on .kb{color:rgba(255,255,255,.6)}
  .lenscap{font-size:12.5px; color:var(--faint); margin:2px 0 12px}
  .lenscap b{color:var(--muted); font-weight:600}
  .graph-ctrls{display:flex; gap:6px; margin-left:auto}
  .gbtn{font:inherit; font-size:12px; color:var(--muted); background:var(--surface2);
    border:1px solid var(--line); border-radius:8px; padding:3px 11px; cursor:pointer}
  .gbtn:hover{background:var(--surface); color:var(--ink)}
  .graph-layout{display:grid; grid-template-columns:1fr 356px; gap:16px}
  @media(max-width:900px){.graph-layout{grid-template-columns:1fr}}
  #cy{height:68vh; min-height:520px; border:1px solid var(--line2); border-radius:14px;
    background:
      radial-gradient(1000px 520px at 50% 30%, #141a34 0%, #0a0e1e 62%, #070a15 100%),
      repeating-linear-gradient(0deg, rgba(120,130,190,.045) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(120,130,190,.045) 0 1px, transparent 1px 46px);
    box-shadow:inset 0 0 120px rgba(0,0,0,.6)}
  @media(max-width:900px){#cy{height:60vh; min-height:420px}}
  .detail{border:1px solid var(--line); border-radius:14px; padding:17px 18px;
    background:linear-gradient(180deg,var(--surface),var(--surface2));
    align-self:start; max-height:68vh; overflow:auto}
  .detail h3{margin:0 0 3px; font-size:18px; display:flex; align-items:center; gap:9px; color:var(--ink)}
  .d-role{color:var(--muted); font-size:12.5px; margin-bottom:11px}
  .d-cap{font-size:13px; color:var(--muted); margin-bottom:6px}
  .d-sec{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--faint); margin:16px 0 9px; font-weight:700}
  .d-stats{display:flex; gap:20px; margin:11px 0}
  .d-stat b{font-size:25px; font-weight:800; letter-spacing:-.01em; color:var(--ink)}
  .d-stat span{font-size:11px; color:var(--faint); display:block; margin-top:1px}
  .legend-row{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); margin-bottom:7px}
  .legend-dot{width:12px; height:12px; border-radius:50%; flex:none; box-shadow:0 0 8px currentColor}
  .legend-dia{width:12px; height:12px; flex:none; transform:rotate(45deg); border:2px solid var(--faint)}
  .d-hint{font-size:12px; color:var(--faint); margin-top:6px}
  .d-kid{font-size:12.5px; color:var(--muted); padding:5px 0; border-top:1px dashed var(--line2)}
  .d-kid b{color:var(--ink); font-weight:600}

  /* производство (бары в карточке агента) */
  .prod-row{display:grid; grid-template-columns:112px 1fr 44px; gap:10px; align-items:center;
    margin-bottom:7px; padding:2px 3px; border-radius:6px}
  .pc-name{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pc-track{background:#0a0e1e; border:1px solid var(--line); border-radius:6px; height:16px; overflow:hidden}
  .pc-bar{width:0; height:100%; border-radius:6px; transition:width .9s cubic-bezier(.22,1,.36,1);
    box-shadow:0 0 12px -2px currentColor}
  .pc-cnt{font-weight:700; font-size:13px; text-align:right; color:var(--ink)}

  /* низ: воронка + доска */
  .two{display:grid; grid-template-columns:1fr 1.4fr; gap:18px}
  @media(max-width:860px){.two{grid-template-columns:1fr}}
  .fun-row{display:grid; grid-template-columns:64px 1fr 32px; align-items:center; gap:10px; margin-bottom:9px}
  .fun-name{font-size:13px; color:var(--muted)}
  .fun-track{background:#0a0e1e; border:1px solid var(--line); border-radius:6px; height:22px; overflow:hidden}
  .fun-n{font-size:13px; font-weight:700; text-align:right; color:var(--ink)}
  .fun-note{font-size:12px; color:var(--faint); margin-top:6px}

  .board{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  @media(max-width:520px){.board{grid-template-columns:1fr}}
  .col-head{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between}
  .col-head .c{color:var(--faint)}
  .tcard{background:var(--surface2); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; margin-bottom:8px; border-left:3px solid var(--faint)}
  .tcard .tt{font-size:13px; font-weight:600; line-height:1.3; color:var(--ink)}
  .tcard .tm{display:flex; align-items:center; gap:6px; margin-top:5px; font-size:11.5px; color:var(--faint)}
  .tcard .eid{color:var(--faint); font-weight:700; margin-right:4px}
  .dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--faint)}

  footer{text-align:center; color:var(--faint); font-size:12px; margin-top:26px}
  footer .lam{letter-spacing:.2em; color:var(--muted)}
  .err{color:var(--s-контент); padding:20px; text-align:center}
</style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">ШТАБ · <b>МОСТИК</b></div>
      <div class="topmeta" id="topmeta">загрузка…</div>
    </header>
    <div id="app"><div class="err" style="color:var(--muted)">Читаю shtab.db…</div></div>
    <footer>
      <span class="lam">Λ · D.</span> &nbsp;·&nbsp; источник: shtab.json &nbsp;·&nbsp;
      рендер: Cytoscape &nbsp;·&nbsp; ведёт: Илон
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
